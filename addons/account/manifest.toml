name = "Accounting"
summary = "Journals, ledgers, taxes, invoices and payments"
category = "Accounting"
author = "Arkana"
license = "MIT OR Apache-2.0"
version = "1.16.2"
depends = ["base", "web", "product", "analytic"]
application = true
exact_only = true
# Data order: security/account_security.xml first, then the default data of each
# model (data/*.xml), then views and report actions, then menus after the actions they point to, and
# security/ir.access.csv last. Demo files (loaded only with demo data, after every data file) are our own
# small generic ledger and its journals, one file per model family; tests/manifest_order.rs holds both lists.
data = [
    "security/account_security.xml",
    "security/account_group_classification.xml",
    "data/account_data.xml",
    "data/default_account_roles.xml",
    "data/account_payment_data.xml",
    "data/fiscal_country_groups.xml",
    "data/payment_term_data.xml",
    "data/account_incoterms_data.xml",
    "data/account_followup_data.xml",
    "views/product_tax_views.xml",
    "views/product_costing_views.xml",
    "views/account_views.xml",
    "views/account_journal_views.xml",
    "views/account_tax_views.xml",
    "views/res_company_views.xml",
    "views/account_payment_term_views.xml",
    "views/account_menus.xml",
    "views/account_dashboard_views.xml",
    "views/account_move_views.xml",
    "views/account_invoice_views.xml",
    "views/account_payment_views.xml",
    "views/account_batch_payment_views.xml",
    "views/account_bank_statement_views.xml",
    "views/account_followup_views.xml",
    "views/account_analytic_views.xml",
    "views/account_budget_views.xml",
    "views/account_asset_views.xml",
    "views/account_recurring_views.xml",
    "views/account_fiscal_position_views.xml",
    "views/account_consolidation_views.xml",
    "views/account_reports.xml",
    "views/account_incoterms_views.xml",
    "security/ir.access.csv",
]
demo = [
    "demo/account_account_demo.xml",
    "demo/account_journal_demo.xml",
    "demo/account_payment_demo.xml",
    "demo/account_tax_demo.xml",
    "demo/account_controlling_demo.xml",
]
