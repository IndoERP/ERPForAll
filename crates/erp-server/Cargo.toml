toml = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }
subtle.workspace = true
url = "=2.5.8"
libc.workspace = true
sysinfo.workspace = true
flate2 = "1.1"
