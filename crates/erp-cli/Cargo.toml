[package]
name = "erp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
erp-modules = { workspace = true }
# `erp access`: the policy of a database through erp-security, as the System principal
erp-addon-base = { workspace = true }
erp-addon-uom = { workspace = true }
erp-addon-mail = { workspace = true }
erp-addon-product = { workspace = true }
erp-addon-web.workspace = true
erp-addon-acceptance-notes.workspace = true
erp-addon-theme-office-blue.workspace = true
erp-server.workspace = true
erp-views.workspace = true
erp-sdk.workspace = true
# `erp addon build/package`: reads the built component's describe under the host's limits
erp-wasm-host.workspace = true
erp-sql.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
erp-data = { workspace = true }
erp-fields = { workspace = true }
erp-orm = { workspace = true }
erp-registry = { workspace = true }
erp-rpc = { workspace = true }
erp-security = { workspace = true }
deadpool-postgres = { workspace = true }
tokio = { workspace = true, features = ["rt", "signal"] }
tokio-postgres = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
# gethostname for the dev node's row (SCALE.NODES review round 1)
rustix = { workspace = true, features = ["system", "fs"] }

[build-dependencies]
sha2.workspace = true
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
erp-addon-web = { workspace = true, features = ["test-support"] }
erp-addon-uom = { workspace = true }
erp-addon-stock = { workspace = true }
erp-addon-barcodes = { workspace = true }
erp-addon-barcodes_gs1_nomenclature = { workspace = true }
erp-addon-sample_library_wasm = { path = "../../examples/wasm/sample_library_wasm", default-features = false }
erp-testkit = { workspace = true }
# a minimal component for the package tests
wat.workspace = true
erp-test-models = { path = "../erp-test-models" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true

[[bin]]
name = "erp"
path = "src/bin/erp.rs"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
