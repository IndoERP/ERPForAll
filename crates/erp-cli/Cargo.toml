[package]
name = "erp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lettre.workspace = true
erp-modules = { workspace = true }
# `erp access`: the policy of a database through erp-security, as the System principal
erp-addon-base = { workspace = true }
erp-addon-ai-base.workspace = true
erp-addon-barcodes = { workspace = true }
erp-addon-uom = { workspace = true }
erp-addon-mail = { workspace = true }
erp-addon-product = { workspace = true }
erp-addon-product-mail = { workspace = true }
erp-addon-web.workspace = true
erp-addon-web-map.workspace = true
erp-addon-acceptance-notes.workspace = true
erp-addon-theme-office-blue.workspace = true
# accounting and inventory: linked, so a served node offers them
erp-addon-analytic.workspace = true
erp-addon-account.workspace = true
erp-addon-purchase.workspace = true
erp-addon-purchase_stock.workspace = true
erp-addon-stock_dropshipping.workspace = true
erp-addon-barcodes_gs1_nomenclature.workspace = true
erp-addon-stock.workspace = true
erp-addon-stock_barcode.workspace = true
erp-addon-quality_control.workspace = true
erp-addon-stock_fleet.workspace = true
erp-addon-product_expiry.workspace = true
erp-addon-delivery.workspace = true
erp-addon-stock_sms.workspace = true
# message thread and chatter on entries, purchase orders and transfers (bridges, auto-installed with mail)
erp-addon-account-mail.workspace = true
erp-addon-purchase-mail.workspace = true
erp-addon-purchase-three-way-match.workspace = true
erp-addon-stock-mail.workspace = true
# sales: the teams and the Sales groups every sales addon builds on
erp-addon-sales_team.workspace = true
# sales: quotations and sales orders
erp-addon-sale.workspace = true
erp-addon-sale_stock.workspace = true
erp-addon-stock_delivery.workspace = true
# dynamic reports: options, line tree and engines of the report screen
erp-addon-reporting.workspace = true
erp-addon-account-reporting.workspace = true
erp-addon-stock_account.workspace = true
erp-addon-stock_landed_costs.workspace = true
erp-addon-valuation.workspace = true
# human resources: job positions (spike)
erp-addon-hr.workspace = true
erp-server.workspace = true
# `erp report-worker`: the render worker the report pool starts
erp-report-typst.workspace = true
erp-report-worker.workspace = true
# printing: the document type and HTML preview, and the merge of print job parts
erp-report.workspace = true
erp-pdf.workspace = true
erp-views.workspace = true
erp-ui-compiler-host.workspace = true
erp-sdk.workspace = true
# `erp addon build/package`: reads the built component's describe() under the host's limits
erp-wasm-host.workspace = true
erp-sql.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
erp-data = { workspace = true }
erp-fields = { workspace = true }
erp-orm = { workspace = true }
erp-registry = { workspace = true }
erp-rpc = { workspace = true }
erp-security = { workspace = true }
deadpool-postgres = { workspace = true }
tokio = { workspace = true, features = ["rt", "signal"] }
tokio-postgres = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
tempfile = { workspace = true }
# gethostname for the dev node's row (SCALE.NODES review round 1)
rustix = { workspace = true, features = ["system", "fs"] }

[build-dependencies]
sha2.workspace = true
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
base64.workspace = true
hmac.workspace = true
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
# Evaluate admitted stored-action expressions in the native AI configuration acceptance test.
erp-expr.workspace = true
erp-addon-web = { workspace = true, features = ["test-support"] }
erp-addon-uom = { workspace = true }
erp-addon-sample_library_wasm = { path = "../../examples/wasm/sample_library_wasm", default-features = false }
erp-testkit = { workspace = true }
# a minimal component for the package tests
wat.workspace = true
# counts the images of the PDF a letterhead prints
lopdf = { version = "=0.45.0", default-features = false }
# opens the .xlsx the pivot download answers (human_pivot_export)
zip = { workspace = true }
erp-test-models = { path = "../erp-test-models" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true

[[bin]]
name = "erp"
path = "src/bin/erp.rs"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
