[package]
name = "erp-blob"
description = "ERPForAll attachment blob store: the AttachmentStore trait, local and in-memory stores, streaming staging with SHA-256/SHA-1, content detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# layer L5 with no internal (workspace) dependency (checked by
# scripts/check-layers.py). Outside the WebAssembly guest set: it does file I/O.
[features]
default = []
# Test-only helpers (a zero GC grace). Never enabled by a production build.
testing = []

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }
sha2 = { workspace = true }
sha1 = { workspace = true }
infer = { workspace = true }
object_store = { workspace = true }
futures-util = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "rt", "macros", "time"] }
tempfile = { workspace = true }

[lints]
workspace = true
