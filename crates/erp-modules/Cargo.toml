[package]
name = "erp-modules"
description = "ERPForAll module manifests, discovery, dependency graph, and lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
erp-fields = { workspace = true }
erp-registry = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
indexmap = { workspace = true }
erp-data = { workspace = true }
erp-expr = { workspace = true }
erp-orm = { workspace = true }
# The runtime of WebAssembly addons; L7 below L8.
erp-wasm-host = { workspace = true }
erp-sql = { workspace = true }
erp-security = { workspace = true }
# Pure H18 view-type publication types attached to each ORM generation (WP3b; layer 7 below 8).
erp-views = { workspace = true }
deadpool-postgres = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
serde_json = { workspace = true }
syn = { workspace = true }
linkme = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
sha2 = { workspace = true }
zip = { workspace = true }
# The dev-folder walk by directory descriptor (openat with O_NOFOLLOW, fstat for hard links) for
# the node registry's addon digest (SCALE.NODES review round 1).
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
erp-testkit = { workspace = true }
# `#[erp_sdk::migration]` declared the way an addon does (tests/migration_macro.rs)
erp-sdk = { workspace = true }
erp-orm = { workspace = true, features = ["test-faults"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
